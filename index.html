<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+JP+N&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"
      rel="stylesheet"
    />
    <title>manken</title>
  </head>
  <body>
    <div class="page">
      <aside class="side side-left">
        <!-- 左の固定画像や装飾 -->
      </aside>

      <main class="center-scroll">
        <section class="firstview">
          <h1>2026・comic club</h1>
          <h2>漫研</h2>
          <div class="images">
            <div class="purin">
              <img src="images/purin.jpeg" alt="" />
              <div class="hukidashi">
                <img src="images/hukidashi.png" alt="" />
              </div>
              <p>
                漫画研究部では、漫画やイラストの制作<br />オリジナルグッズ作りなど<br />さまざまな創作活動を行っています!
              </p>
            </div>
            <div class="manken"><img src="images/manken.jpeg" alt="" /></div>
            <div class="azarashi">
              <img src="images/azarashi.jpeg" alt="" />
              <div class="hukidashi2">
                <img src="images/hukidashi2.png" alt="" />
              </div>
              <p>
                絵を描くのが好きな方<br />
                漫画やものづくりに興味がある方は<br />
                ぜひ一緒に活動しましょう！
              </p>
            </div>
          </div>
        </section>
        <section class="sukima">
          <p>manken</p>
        </section>
        <section class="festival">
          <h1>FESTIVAL</h1>
          <p>
            文化祭では<br>
            部員たちが制作した部誌の販売に加え<br>
            イラストのリクエスト受付も行っています。<br>
            ぜひお気軽にお立ち寄りください！
          </p>
        </section>
      </main>

      <aside class="side side-right">
        <!-- 右の固定画像や装飾 -->
      </aside>
    </div>
  </body>
</html>
